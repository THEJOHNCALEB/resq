name: resq
description: "ResQ — Offline Emergency Intelligence"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  sqflite: ^2.4.2
  path: ^1.9.1

  flutter_secure_storage: ^9.2.4

  flutter_gemma: 1.3.0
  flutter_gemma_litertlm: ^1.1.0

  camera: ^0.11.1
  permission_handler: ^12.0.0
  image_picker: ^1.1.2
  record: ^6.0.0

  geolocator: ^13.0.2

  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

  intl: ^0.19.0
  uuid: ^4.5.1

  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/data/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  remove_alpha_ios: true
